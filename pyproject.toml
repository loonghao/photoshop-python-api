[project]
name = "photoshop-python-api"
version = "0.24.2"
description = "Python API for Photoshop."
keywords = ["python-api, photoshop-python-api", "photoshop", "python"]
authors = [{name = "longhao", email = "hal.long@outlook.com"}]
license = "MIT"
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.10,<4.0"

[project.urls]
homepage = "https://github.com/loonghao/photoshop-python-api"
repository = "https://github.com/loonghao/photoshop-python-api"
documentation = "https://photoshop-python-api.readthedocs.io/en/master/"

[tool.poetry]
packages = [
    { include = "photoshop" },
]

[tool.poetry.build]
generate-setup-file = false

[tool.poetry.dependencies]
wheel = "^0.46.3"
comtypes = "^1.4.15"

[tool.poetry.group.dev.dependencies]
commitizen = "^2.17.8"
pre-commit = "^2.13.0"
codecov = "^2.1.11"
pylint = "^2.8.2"
isort = "^5.8.0"
pytest = "^9.0.2"
flake8 = "^4.0.0"
mypy = "^1.19.1"
coverage = "^7.0.0"
mkdocs = "^1.2.2"
mkdocs-git-revision-date-plugin = "^0.3.1"
black = "^23.0.0"
mkdocs-material = "^8.2.5"
mkdocstrings-python = "^1.0.0"
mkdocs-pymdownx-material-extras = "^2.0"
mkdocs-same-dir = "^0.1.1"
mkdocs-include-markdown-plugin = "^3.3.0"
mkdocs-gen-files = "^0.5.0"
mkdocs-autolinks-plugin = "^0.7.0"
mkdocs-minify-plugin = "^0.8.0"
mkdocs-git-revision-date-localized-plugin = "^1.0.0"
pytest-cov = "^4.0.0"
stringcase = "^1.2.0"
mkdocs-literate-nav = "^0.6.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
target_version = ['py37']
include = '\.pyi?$'
exclude = '''

(
  /(
      \.eggs         # exclude a few common directories in the
    | \.git          # root of the project
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
  )/
  | foo.py           # also separately exclude a file named foo.py in
                     # the root of the project
)
'''

[tool.isort]
profile = "black"
atomic = true
include_trailing_comma = true
lines_after_imports = 2
lines_between_types = 1
use_parentheses = true
src_paths = ["photoshop", "test"]
filter_files = true
known_first_party = "photoshop"

# Enforce import section headers.
import_heading_future = "Import future modules"
import_heading_stdlib = "Import built-in modules"
import_heading_thirdparty = "Import third-party modules"
import_heading_firstparty = "Import local modules"

force_sort_within_sections = true
force_single_line = true

# All project unrelated unknown imports belong to third-party.
default_section = "THIRDPARTY"
skip_glob = "*/docs/conf.py"

# Linting lives here and nowhere else. This replaces the deleted .flake8, which
# flake8 could not express in pyproject.toml (support landed in flake8 5).
[tool.ruff]
line-length = 120
# Declared explicitly: ruff would otherwise infer py310 from requires-python and
# stop flagging syntax that Python 3.8/3.9 cannot actually run.
target-version = "py38"
extend-exclude = [
    "docs/source/conf.py",
    "old",
    "build",
    "dist",
    "venv",
    "docs",
    "examples",
]

[tool.ruff.lint]
# Behaviour-preserving port of .flake8. The old file also configured
# flake8-docstrings (google) and flake8-quotes, but neither plugin was installed
# in CI, so only pycodestyle/pyflakes rules ever fired. Quote rules are enabled
# here because the codebase already satisfies them; the docstring rules are not,
# see the migration PR for the measured violation count.
select = ["E", "W", "F", "Q"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"
multiline-quotes = "double"
docstring-quotes = "double"
avoid-escape = true

[tool.ruff.lint.isort]
lines-after-imports = 2
lines-between-types = 1
known-first-party = ["photoshop"]
