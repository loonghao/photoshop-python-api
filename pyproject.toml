[tool.poetry]
name = "photoshop-python-api"
version = "0.25.0"
description = "Python API for Photoshop."
homepage = "https://github.com/loonghao/photoshop-python-api"
repository = "https://github.com/loonghao/photoshop-python-api"
documentation = "https://photoshop-python-api.readthedocs.io/en/master/"
keywords = ["python-api, photoshop-python-api", "photoshop", "python"]
authors = ["longhao <hal.long@outlook.com>"]
license = "MIT"
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
packages = [{ include = "photoshop" }]

[tool.poetry.build]
generate-setup-file = false

[tool.poetry.dependencies]
python = ">=3.8,<4.0"
wheel = [
    { version = "^0.46.3", python = ">=3.9" },
    { version = "^0.45.0", python = "<3.9" },
]
comtypes = [
    { version = "^1.4.15", python = ">=3.9" },
    { version = ">=1.1.11,<1.4.13", python = "<3.9" },
]

[tool.poetry.group.dev.dependencies]
commitizen = "^2.17.8"
pre-commit = { version = "^4.6.0", python = ">=3.10" }
codecov = "^2.1.11"
pylint = { version = "^4.0.5", python = ">=3.10" }
ruff = "^0.16.9"
pytest = [
    { version = "^9.0.2", python = ">=3.10" },
    { version = "^7.4.4", python = "<3.10" },
]
mypy = { version = "^1.19.1", python = ">=3.9" }
coverage = "^7.0.0"
mkdocs = "^1.2.2"
mkdocs-git-revision-date-plugin = "^0.3.1"
mkdocs-material = "^8.2.5"
mkdocstrings-python = "^1.0.0"
mkdocs-pymdownx-material-extras = "^2.0"
mkdocs-same-dir = "^0.1.1"
mkdocs-include-markdown-plugin = "^7.0.0"
mkdocs-gen-files = "^0.5.0"
mkdocs-autolinks-plugin = "^0.7.0"
mkdocs-minify-plugin = "^0.8.0"
mkdocs-git-revision-date-localized-plugin = "^1.0.0"
pytest-cov = "^4.0.0"
stringcase = "^1.2.0"
mkdocs-literate-nav = "^0.6.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

# Linting lives here and nowhere else. This replaces the deleted .flake8, which
# flake8 could not express in pyproject.toml (support landed in flake8 5).
[tool.ruff]
line-length = 120
# Declared explicitly: ruff would otherwise infer py310 from requires-python and
# stop flagging syntax that Python 3.8/3.9 cannot actually run.
target-version = "py38"
extend-exclude = [
    "docs/source/conf.py",
    "old",
    "build",
    "dist",
    "venv",
    "docs",
    "examples",
]

[tool.ruff.lint]
# Behaviour-preserving port of .flake8. The old file also configured
# flake8-docstrings (google) and flake8-quotes, but neither plugin was installed
# in CI, so only pycodestyle/pyflakes rules ever fired. Quote rules are enabled
# here because the codebase already satisfies them.
#
# The docstring rules (D) are enabled, with the debt that existed when they were
# switched on recorded per directory below. See the baseline block for what that
# does and does not catch — the short version is that a rule listed for a file
# stays silent for that file, including new violations of it.
select = ["E", "W", "F", "Q", "I", "UP", "D"]

# The google convention selects a narrower set of pydocstyle rules than leaving
# the convention unset: 665 findings under google, 804 under `pep257`, 864 with
# no convention at all. It also resolves the two mutually exclusive rule pairs
# (D203/D211 and D212/D213), so ruff emits no warnings under this config.
[tool.ruff.lint.pydocstyle]
convention = "google"

# ── Docstring baseline ──────────────────────────────────────────────────────
# 665 findings existed when D was switched on: 507 in the photoshop/ subtree,
# 158 in test/, 0 in scripts/. (The lint scope was `photoshop` alone when the
# baseline was written, so 507 was the whole CI scope at the time; it is now
# `photoshop test scripts`, which is all 665.)
#
# Each entry is a directory tier plus the rules that tier currently violates.
# The number on a tier is an UPPER BOUND, not a count: the tiers overlap, so the
# eight labels add up to 883 against 665 actual findings. Do not try to
# reconcile them.
#
# Read this before touching anything here. `per-file-ignores` is a UNION of
# every pattern that matches a file, not a "most specific pattern wins" lookup:
#
#   - A rule listed for a file is ignored for that file, so NEW violations of
#     that same rule are also ignored. This baseline stops the tree from going
#     red; it does not stop new debt in already-baselined rules. Only violations
#     of rules that are NOT listed for a file get caught.
#   - Deleting a rule from an entry only tightens anything when no other
#     matching entry still lists it. Every file under photoshop/ also matches
#     "photoshop/**", so removing a rule from a narrower tier while the widest
#     tier still lists it is a no-op. Tighten a rule by removing it from the
#     widest tier that covers the files you just fixed.
[tool.ruff.lint.per-file-ignores]
# Ordered narrowest to widest, but order carries no meaning to ruff: matching
# entries are unioned, so the widest entry below is the effective floor for
# everything under photoshop/. Counts below are per-tier upper bounds.
#
# Enum constant tables: one IntEnum class per Photoshop constant, 129 findings.
"photoshop/api/enumerations.py" = ["D101"]
# Save-option wrappers, 112 findings.
"photoshop/api/save_options/**" = ["D100", "D102", "D104", "D107", "D205", "D209", "D400", "D401", "D414", "D415", "D417"]
# Open-option wrappers, 9 findings.
"photoshop/api/open_options/**" = ["D100", "D102", "D104", "D107"]
# Color model wrappers, 19 findings.
"photoshop/api/colors/**" = ["D100", "D102", "D104", "D105", "D107", "D401"]
# Manual tests driving a real Photoshop instance, 118 findings.
"test/manual_test/**" = ["D100", "D101", "D102", "D401", "D419"]
# Unit tests, 45 findings. (118 + 45 = 163, but the test/ subtree measures 158:
# the two tiers overlap, so the labels bound the debt rather than count it.)
"test/**" = ["D100", "D101", "D102", "D103", "D104", "D105", "D107", "D202", "D401", "D403"]
# The COM wrapper API, 443 findings.
"photoshop/api/**" = ["D100", "D101", "D102", "D105", "D107", "D205", "D209", "D212", "D214", "D301", "D400", "D401", "D403", "D404", "D405", "D413", "D414", "D415", "D417"]
# Package root, 8 findings. Effective floor for the whole package: a rule listed
# here is ignored for every file under photoshop/, whichever tier above also
# lists it. Remove a rule here once no file under photoshop/ violates it.
"photoshop/**" = ["D100", "D102", "D104", "D105", "D205", "D401", "D403"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"
multiline-quotes = "double"
docstring-quotes = "double"
avoid-escape = true

[tool.ruff.lint.isort]
lines-between-types = 1
force-single-line = true

# Enforce import section headers.
import-heading.future = "Import future modules"
import-heading.standard-library = "Import built-in modules"
import-heading.third-party = "Import third-party modules"
import-heading.first-party = "Import local modules"

[tool.pytest.ini_options]
# Also collect the manual tests so they are visible to CI. They drive a real
# Photoshop instance and are skipped automatically when none is installed.
python_files = ["test_*.py", "*_test.py", "manual_test_*.py"]
testpaths = ["test"]
